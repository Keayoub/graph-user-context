[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graph-user-context"
version = "0.1.0"
description = "Tenant organizational context synchronization and Microsoft Graph OBO API"
requires-python = ">=3.11"
dependencies = [
  "azure-identity==1.25.1",
  "azure-search-documents==11.6.0",
  "fastapi==0.117.1",
  "httpx==0.28.1",
  "msal==1.34.0",
  "pydantic-settings==2.10.1",
  "PyJWT[crypto]==2.10.1",
  "uvicorn[standard]==0.36.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "respx==0.23.1",
  "ruff==0.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_context"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["graph_context"]
mypy_path = "src"
warn_unused_ignores = true
